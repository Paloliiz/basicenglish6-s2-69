<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Lab Lobby | PARALLEL DIMENSION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        scifi: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        cosmic: { 950: '#070510', 900: '#0d091d', 800: '#150f2e', 700: '#211844' },
                        neon: { cyan: '#38bdf8', purple: '#a855f7', pink: '#ec4899', green: '#34d399', red: '#f43f5e', orange: '#fb923c', gold: '#facc15' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #070510;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 45%);
            background-attachment: fixed;
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass-panel {
            background: linear-gradient(145deg, rgba(21, 15, 46, 0.88), rgba(13, 9, 29, 0.94));
            border: 1px solid rgba(168, 85, 247, 0.35);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(168, 85, 247, 0.1);
            backdrop-filter: blur(12px);
        }
        .boss-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(100, 116, 139, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            position: relative;
        }
        .boss-card:hover {
            transform: translateY(-5px);
        }
        .boss-card.u3:hover {
            border-color: #39ff14;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.3);
        }
        .boss-card.u4:hover {
            border-color: #facc15;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.3);
        }
        
        .btn-enter {
            transition: all 0.3s ease;
        }
        .btn-enter.u3 {
            background: linear-gradient(90deg, #059669 0%, #10b981 100%);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .btn-enter.u4 {
            background: linear-gradient(90deg, #d97706 0%, #f59e0b 100%);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
        .btn-enter:hover {
            filter: brightness(1.2);
            transform: scale(1.02);
        }
        
        .boss-img-container {
            width: 100%;
            height: 200px;
            background-color: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .boss-img-container::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(15, 23, 42, 1), transparent);
        }
        .boss-img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .boss-card:hover .boss-img {
            opacity: 1;
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-10 flex flex-col items-center justify-center">

    <div class="glass-panel rounded-3xl max-w-4xl w-full p-6 sm:p-10 relative overflow-hidden">
        
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-red-950/80 border border-red-500/50 shadow-[0_0_20px_rgba(244,63,94,0.4)] mb-4 animate-pulse">
                <span class="text-3xl">🎙️</span>
            </div>
            <h1 class="font-scifi text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-400 mb-2 tracking-wider">
                VOICE LAB: BOSS RUSH
            </h1>
            <p class="text-slate-300 text-sm sm:text-base">โถงทางเชื่อมมิติ เลือกห้องบอสที่คุณต้องการต่อสู้เพื่อทดสอบทักษะคำศัพท์</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto">
            
            <!-- BOSS U3 -->
            <div class="boss-card u3 rounded-2xl flex flex-col">
                <div class="boss-img-container border-b border-green-500/30">
                    <!-- รูปบอสบทที่ 3 (The Bio-Phantom) -->
                    <div class="absolute inset-0 flex items-center justify-center text-6xl opacity-50 z-10">🦠</div>
                    <img src="boss_biophantom.png" alt="The Bio-Phantom" class="boss-img" onerror="this.style.display='none'">
                </div>
                <div class="p-6 flex-grow flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded bg-green-950 text-green-400 border border-green-500/30 font-scifi">UNIT 3</span>
                            <span class="text-xs text-amber-300 font-bold font-scifi">⭐ 200 XP</span>
                        </div>
                        <h3 class="font-scifi text-xl font-bold text-white mb-2">The Bio-Phantom</h3>
                        <p class="text-sm text-slate-300 mb-6">บอสแห่งพิษชีวภาพ ทดสอบคำศัพท์หมวดหมู่ Health & Medical</p>
                    </div>
                    <button onclick="enterBossRoom('voice_lab.html')" class="btn-enter u3 w-full py-3 rounded-xl font-bold text-white font-scifi tracking-wider">
                        ENTER COMBAT
                    </button>
                </div>
            </div>

            <!-- BOSS U4 -->
            <div class="boss-card u4 rounded-2xl flex flex-col">
                <div class="boss-img-container border-b border-yellow-500/30">
                    <!-- รูปบอสบทที่ 4 (The Gilded Glitch) -->
                    <div class="absolute inset-0 flex items-center justify-center text-6xl opacity-50 z-10">💰</div>
                    <img src="boss_thegildedglitch.png" alt="The Gilded Glitch" class="boss-img" onerror="this.style.display='none'">
                </div>
                <div class="p-6 flex-grow flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded bg-yellow-950 text-yellow-400 border border-yellow-500/30 font-scifi">UNIT 4</span>
                            <span class="text-xs text-amber-300 font-bold font-scifi">⭐ 200 XP</span>
                        </div>
                        <h3 class="font-scifi text-xl font-bold text-white mb-2">The Gilded Glitch</h3>
                        <p class="text-sm text-slate-300 mb-6">ปีศาจทองคำผู้มัวเมา ทดสอบคำศัพท์หมวดหมู่ Finance & Spending</p>
                    </div>
                    <button onclick="enterBossRoom('voice_lab_u4.html')" class="btn-enter u4 w-full py-3 rounded-xl font-bold text-white font-scifi tracking-wider">
                        ENTER COMBAT
                    </button>
                </div>
            </div>

        </div>
        
        <div class="text-center mt-10">
            <button onclick="window.close()" class="text-sm text-slate-400 hover:text-white underline transition">
                กลับสู่หน้า Dashboard
            </button>
        </div>
    </div>

    <script>
        // ดึง sid จาก URL ของ Lobby เพื่อส่งต่อไปยังห้องบอสแต่ละห้อง
        let currentSid = "GUEST";
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('sid')) {
                currentSid = urlParams.get('sid');
            }
        });

        function enterBossRoom(targetPage) {
            window.location.href = `${targetPage}?sid=${currentSid}`;
        }
    </script>
</body>
</html>
